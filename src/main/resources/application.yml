---
server:
  port: 8080
spring:
  config:
    activate:
      on-profile: local
  application:
    name: api
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# JWT Configuration
jwt:
  secret: jiujitsu-secret-key-for-development-only-change-in-production-environment
  access-token-validity: 3600000
  refresh-token-validity: 604800000

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger:
    path: /swagger-ui.html
    server:
      url: http://localhost:8080
---
server:
  port: 8080
spring:
  config:
    activate:
      on-profile: dev
  application:
    name: api
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# JWT Configuration
jwt:
  secret: jiujitsu-secret-key-for-development-only-change-in-production-environment
  access-token-validity: 3600000
  refresh-token-validity: 604800000

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger:
    path: /swagger-ui.html
    server:
      url: https://api.developer-chanq.xyz/
