# === [공통] 모든 프로필에 적용되는 Actuator 설정 ===
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: "health,info"    # 필요시 metrics,loggers,httpexchanges 등 추가
  endpoint:
    health:
      show-details: "never"       # never | when_authorized | always
      probes:
        enabled: true             # /actuator/health/liveness, /readiness 활성화
---
server:
  port: 8080
logging:
  level:
    root: INFO
    com.jiujitsu.api: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
spring:
  output:
    ansi:
      enabled: ALWAYS
  config:
    activate:
      on-profile: local
  application:
    name: api
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# JWT Configuration
jwt:
  secret: jiujitsu-secret-key-for-development-only-change-in-production-environment
  access-token-validity: 3600000
  refresh-token-validity: 604800000

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger:
    path: /swagger-ui.html
    server:
      url: http://localhost:8080
