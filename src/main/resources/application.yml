# application.yml
spring:
  application:
    name: api
  output:
    ansi:
      enabled: ALWAYS

server:
  port: 8080

logging:
  level:
    root: INFO
    com.jiujitsu.api: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"

# 공통 Actuator 설정
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: "health,info"
  endpoint:
    health:
      show-details: "never"
      probes:
        enabled: true

# JWT 공통
jwt:
  secret: jiujitsu-secret-key-for-development-only-change-in-production-environment
  access-token-validity: 3600000
  refresh-token-validity: 604800000

# Swagger/OpenAPI 공통
springdoc:
  api-docs:
    path: /api-docs
  swagger:
    path: /swagger-ui.html

# Apple Key 공통
apple:
  filePath: ./jiujitsuLab_AuthKey_Z3HRNZG68M.p8