# application-local.yml
spring:
  config:
    activate:
      on-profile: local
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  datasource:
    url: jdbc:p6spy:h2:mem:testdb   # ✅ p6spy prefix 추가
    driver-class-name: com.p6spy.engine.spy.P6SpyDriver  # ✅ 드라이버 변경
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# logging
logging:
  level:
    p6spy: info
    org.hibernate.SQL: off
    org.hibernate.type.descriptor.sql: off

# CORS
cors:
  allowed-origins:
    - http://localhost:3000

# Swagger server URL
springdoc:
  swagger-ui:
    server:
      url: http://localhost:8080/api
