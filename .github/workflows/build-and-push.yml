name: Build & Push to GHCR

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # GITHUB_TOKEN 사용할 때 필요. PAT만 써도 둬도 무방

env:
  GHCR_IMAGE: ghcr.io/jiu-jitsu-org/jiu-jitsu-backend-api

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # ⬇️ PAT 로그인: username은 PAT 소유자(예: kyuchanE). 하드코딩 대신 시크릿 권장
      - name: Login to GHCR (PAT)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}   # <- 리포 시크릿에 저장 
          password: ${{ secrets.GHCR_PAT }}        # <- write:packages (+repo) 스코프, SSO 승인

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=latest-develop
            type=sha,format=short,prefix=sha-

      - name: Build & Push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
